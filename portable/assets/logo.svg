<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Reckoning mark: two isolated halves (praise vs. critic) split by a gap, verdict at the centre. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1e2b"/>
      <stop offset="1" stop-color="#0e1017"/>
    </linearGradient>
    <clipPath id="left"><rect x="0" y="0" width="244" height="512"/></clipPath>
    <clipPath id="right"><rect x="268" y="0" width="244" height="512"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="168" fill="#2ec4a6" clip-path="url(#left)"/>
  <circle cx="256" cy="256" r="168" fill="#ff5a4e" clip-path="url(#right)"/>
  <!-- verdict diamond bridging the gap -->
  <rect x="210" y="210" width="92" height="92" rx="10" transform="rotate(45 256 256)" fill="#0e1017"/>
  <rect x="226" y="226" width="60" height="60" rx="6" transform="rotate(45 256 256)" fill="#f5f3ee"/>
</svg>
